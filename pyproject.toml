[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "optiprofiler-pycutest"
description = "OptiProfiler problem-library plugin for PyCUTEst/CUTEst"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    {name = "Cunxin Huang", email = "cun-xin.huang@connect.polyu.hk"},
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.17.0",
    "optiprofiler>=1.4.0",
    "pandas>=1.1.0",
]
version = "0.1.0"

[project.optional-dependencies]
runtime = ["pycutest>=1.6.1"]
tests = ["pycutest>=1.6.1"]

[project.entry-points."optiprofiler.problem_libraries"]
pycutest = "optiprofiler_pycutest:get_problem_library"

[project.urls]
homepage = "https://www.optprof.com"
source = "https://github.com/optiprofiler/pycutest"
upstream = "https://github.com/jfowkes/pycutest"

[tool.setuptools]
packages = ["optiprofiler_pycutest"]
package-dir = {"optiprofiler_pycutest" = "."}
include-package-data = false

[tool.setuptools.package-data]
optiprofiler_pycutest = [
    "README.md",
    "config.txt",
    "probinfo_pycutest.csv",
]
