name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "43 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      NUMEXPR_NUM_THREADS: "2"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout OptiProfiler
        uses: actions/checkout@v4
        with:
          repository: optiprofiler/optiprofiler
          path: optiprofiler
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran make wget

      - name: Install CUTEst
        run: |
          chmod +x .github/actions/collect_info/setup.sh
          ./.github/actions/collect_info/setup.sh

      - name: Set CUTEst environment variables
        run: |
          echo "ARCHDEFS=$HOME/cutest/archdefs" >> $GITHUB_ENV
          echo "SIFDECODE=$HOME/cutest/sifdecode" >> $GITHUB_ENV
          echo "CUTEST=$HOME/cutest/cutest" >> $GITHUB_ENV
          echo "MASTSIF=$HOME/cutest/mastsif" >> $GITHUB_ENV
          echo "MYARCH=pc64.lnx.gfo" >> $GITHUB_ENV
          echo "$HOME/cutest/sifdecode/bin:$HOME/cutest/cutest/bin" >> $GITHUB_PATH

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e optiprofiler
          python -m pip install pycutest

      - name: Run adapter smoke and random tests
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
