name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "43 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      NUMEXPR_NUM_THREADS: "2"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout OptiProfiler
        uses: actions/checkout@v4
        with:
          repository: optiprofiler/optiprofiler
          path: optiprofiler
          ref: main

      - name: Bootstrap the API-v1 protocol under development
        shell: bash
        run: |
          protocol_file="optiprofiler/python/optiprofiler/problem_libraries.py"
          if ! test -f "$protocol_file" || ! grep -q "class ProblemLibraryPlugin" "$protocol_file"; then
            git -C optiprofiler fetch --depth=1 origin python
            git -C optiprofiler checkout --detach FETCH_HEAD
          fi
          grep -q "PROBLEM_LIBRARY_API_VERSION = 1" "$protocol_file"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran make wget

      - name: Install CUTEst
        run: |
          chmod +x .github/actions/collect_info/setup.sh
          ./.github/actions/collect_info/setup.sh

      - name: Set CUTEst environment variables
        run: |
          echo "ARCHDEFS=$HOME/cutest/archdefs" >> $GITHUB_ENV
          echo "SIFDECODE=$HOME/cutest/sifdecode" >> $GITHUB_ENV
          echo "CUTEST=$HOME/cutest/cutest" >> $GITHUB_ENV
          echo "MASTSIF=$HOME/cutest/mastsif" >> $GITHUB_ENV
          echo "MYARCH=pc64.lnx.gfo" >> $GITHUB_ENV
          echo "$HOME/cutest/sifdecode/bin:$HOME/cutest/cutest/bin" >> $GITHUB_PATH

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m pip install -e optiprofiler
          python -m pip install pycutest
          python -m pip install -e . --no-deps --no-build-isolation

      - name: Build wheel and source distribution
        run: python -m build

      - name: Check distribution licenses and contents
        run: python scripts/check_distribution_licenses.py

      - name: Run adapter smoke and random tests
        run: |
          python -m unittest discover -s tests -p 'test_*.py'

      - name: Fresh installed plugin smoke
        run: |
          wheel="$(python -c 'from pathlib import Path; print(next(Path("dist").glob("*.whl")).resolve())')"
          python -m pip uninstall -y optiprofiler-pycutest
          python -m pip install --no-deps "$wheel"
          tmpdir="$(mktemp -d)"
          cd "$tmpdir"
          python - <<'PY'
          from optiprofiler.problem_libraries import ProblemLibraryRef, load_problem_library
          ref = ProblemLibraryRef(
              "pycutest",
              "entry_point",
              "optiprofiler_pycutest:get_problem_library",
              distribution="optiprofiler-pycutest",
          )
          plugin = load_problem_library(ref)
          assert plugin.name == "pycutest"
          assert "ROSENBR" in plugin.select({"ptype": "u", "mindim": 2, "maxdim": 2}, {
              "variable_size": "default",
              "test_feasibility_problems": 0,
          })
          problem = plugin.load("ROSENBR", {
              "variable_size": "default",
              "test_feasibility_problems": 0,
          })
          assert problem.n == 2
          assert float(problem.fun(problem.x0)) == 24.199999999999996
          PY
